name: DASHKA WIRE morning delivery

on:
  push:
    paths:
      - feed.json
      - latest.md
  schedule:
    # 08:00, 09:00 and 10:00 Europe/Moscow (UTC+3, no DST).
    - cron: '0 5-7 * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: Send one test message to the configured Telegram chat
        type: boolean
        required: false
        default: false
      pair_code:
        description: Reply only to the chat that sent this exact pairing phrase
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: dashka-wire-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Send published edition
        run: |
          if [ -n "$PAIR_CODE" ]; then
            python3 delivery/send_digest.py --pair-code "$PAIR_CODE"
          elif [ "$TEST_TELEGRAM" = "true" ]; then
            python3 delivery/send_digest.py --test-telegram
          else
            python3 delivery/send_digest.py
          fi
        env:
          PAIR_CODE: ${{ inputs.pair_code || '' }}
          TEST_TELEGRAM: ${{ inputs.test_telegram || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAIR_KEY: ${{ secrets.PAIR_KEY }}
      - name: Save delivery markers
        if: always()
        run: |
          if [ -d .delivery ]; then
            git config user.name "DASHKA WIRE delivery"
            git config user.email "323653926+darabelenkova1286-tech@users.noreply.github.com"
            git add .delivery
            if ! git diff --cached --quiet; then
              git commit -m "Record delivered morning edition"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
